<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/calculator.css">
</head>
<body class="calc-page">

  <a href="index.html" class="back-link">&larr; Back to portfolio</a>

  <!-- STRUCTURE OF CALCULATOR -->
  <main class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="calculator">

      <!-- Display -->
      <div class="display">
        <div id="history" class="history" aria-live="off"></div>
        <div id="screen" class="screen" aria-live="polite">0</div>
      </div>

      <!-- Keypad (Bootstrap grid) -->
      <div class="keys">
        <div class="row g-2">
          <div class="col-3"><button class="key key-fn"  data-action="clear">AC</button></div>
          <div class="col-3"><button class="key key-fn"  data-action="delete">DEL</button></div>
          <div class="col-3"><button class="key key-fn"  data-action="percent">%</button></div>
          <div class="col-3"><button class="key key-op"  data-action="operator" data-value="/">÷</button></div>

          <div class="col-3"><button class="key" data-action="number" data-value="7">7</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="8">8</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="9">9</button></div>
          <div class="col-3"><button class="key key-op" data-action="operator" data-value="*">×</button></div>

          <div class="col-3"><button class="key" data-action="number" data-value="4">4</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="5">5</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="6">6</button></div>
          <div class="col-3"><button class="key key-op" data-action="operator" data-value="-">−</button></div>

          <div class="col-3"><button class="key" data-action="number" data-value="1">1</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="2">2</button></div>
          <div class="col-3"><button class="key" data-action="number" data-value="3">3</button></div>
          <div class="col-3"><button class="key key-op" data-action="operator" data-value="+">+</button></div>

          <div class="col-6"><button class="key" data-action="number" data-value="0">0</button></div>
          <div class="col-3"><button class="key" data-action="decimal">.</button></div>
          <div class="col-3"><button class="key key-eq" data-action="equals">=</button></div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/calculator.js"></script>
</body>
</html>
